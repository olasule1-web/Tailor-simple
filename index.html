<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tailor Keeper - Luky Full</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#f2f2f7;color:#111}
.top{position:sticky;top:0;z-index:20;background:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.logo{display:flex;gap:8px;align-items:center}.ic{width:36px;height:36px;background:#1a1a1a;border-radius:10px;display:grid;place-items:center;font-size:18px}
.h{font-weight:800;font-size:15px} .sub{font-size:11px;color:#666}
.btn{border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
.btn-dark{background:#111;color:#fff}.btn-light{background:#e9e9ee}.btn-green{background:#16a34a;color:#fff}
.pills{display:flex;gap:8px;overflow:auto;padding:8px 12px}.pills button{white-space:nowrap}
.pill-active{background:#111;color:#fff}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 90px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.lab{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.4px}.val{font-weight:800;font-size:17px;margin-top:2px}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid #e5e5ea;background:#fff;outline:0}
.tabs{display:flex;background:#e9e9ee;border-radius:999px;padding:4px;gap:4px;margin:12px 0}
.tabs button{flex:1;border:0;padding:9px;border-radius:999px;font-weight:700;font-size:13px;background:transparent;cursor:pointer}
.tabs button.active{background:#111;color:#fff}
.job{background:#fff;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.small{font-size:12px;color:#666}.b{font-weight:700}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:50;padding:12px}
.modal-bg.open{display:grid}.modal{width:100%;max-width:480px;background:#fff;border-radius:20px;padding:14px;max-height:92vh;overflow:auto}
.inp{width:100%;padding:11px;border:1px solid #e5e5ea;border-radius:12px;outline:0;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;gap:8px;align-items:center}
</style>
</head>
<body>
<div class="top">
  <div class="logo"><div class="ic">✂️</div><div><div class="h">Tailor Keeper</div><div class="sub">Luky - Full</div></div></div>
  <div class="row"><button class="btn btn-light" id="langBtn">HA</button><button class="btn btn-light" onclick="if(confirm('Logout clear?')){localStorage.clear();location.reload()}">Logout</button></div>
</div>

<div class="pills" id="periodPills">
  <button class="btn pill-active" data-p="all">All Time</button>
  <button class="btn btn-light" data-p="month">This Month</button>
  <button class="btn btn-light" data-p="quarter">Quarter</button>
  <button class="btn btn-light" data-p="year">Year</button>
</div>

<div class="wrap">
  <div class="small" id="showing">Showing: All Time (0)</div>
  <div class="stats">
    <div class="card"><div class="lab">Total Sales</div><div class="val" id="sSales">₦0</div></div>
    <div class="card"><div class="lab">Received</div><div class="val" id="sRec">₦0</div></div>
    <div class="card"><div class="lab">Outstanding</div><div class="val" id="sOut">₦0</div></div>
    <div class="card"><div class="lab">Real Profit</div><div class="val" id="sProf" style="color:#16a34a">₦0</div></div>
  </div>

  <input class="search" id="search" placeholder="🔍 Search customers...">
  <div class="tabs">
    <button data-tab="customers" class="active">Customers</button>
    <button data-tab="bulk">Bulk</button>
    <button data-tab="report">Report</button>
    <button data-tab="sell">Sell</button>
  </div>

  <div id="panelCustomers"></div>
  <div id="panelBulk" style="display:none"></div>
  <div id="panelReport" style="display:none"></div>
  <div id="panelSell" style="display:none"></div>
</div>

<button style="position:fixed;bottom:18px;right:18px;width:56px;height:56px;border-radius:50%;background:#111;color:#fff;font-size:26px;border:0;box-shadow:0 8px 20px rgba(0,0,0,.3)" onclick="openForm()">+</button>

<div class="modal-bg" id="formBg"><div class="modal">
  <div class="row" style="justify-content:space-between"><h3 style="margin:0">New Job</h3><button class="btn btn-light" onclick="closeForm()">✕</button></div>
  <div class="grid2" style="margin-top:8px"><div><label class="small b">Customer Name</label><input class="inp" id="fName"></div><div><label class="small b">Phone</label><input class="inp" id="fPhone"></div></div>
  <label class="small b">Style</label><input class="inp" id="fStyle" placeholder="Agbada, Kaftan...">
  <div class="grid2"><div><label class="small b">Chest</label><input class="inp" id="fChest"></div><div><label class="small b">Length</label><input class="inp" id="fLength"></div><div><label class="small b">Waist</label><input class="inp" id="fWaist"></div><div><label class="small b">Shoulder</label><input class="inp" id="fShoulder"></div></div>
  <div class="grid2"><div><label class="small b">Price ₦</label><input class="inp" type="number" id="fPrice"></div><div><label class="small b">Deposit ₦</label><input class="inp" type="number" id="fDep"></div><div><label class="small b">Cost (for profit)</label><input class="inp" type="number" id="fCost" placeholder="Fabric cost"></div><div><label class="small b">Collection Date</label><input class="inp" type="date" id="fDate"></div></div>
  <label class="small b">Note</label><input class="inp" id="fNote">
  <button class="btn btn-dark" style="width:100%;margin-top:12px;padding:12px" onclick="saveJob()">Save Job</button>
  <input type="hidden" id="fId">
</div></div>

<script>
let DB=JSON.parse(localStorage.getItem('tailor-full-v3')||'[]');
let SELL=JSON.parse(localStorage.getItem('tailor-sell-v3')||'[]');
let period='all'; let tab='customers'; let selectedBulk=new Set();
function save(){localStorage.setItem('tailor-full-v3',JSON.stringify(DB));localStorage.setItem('tailor-sell-v3',JSON.stringify(SELL));render();}
function periodFilter(d){
 if(period==='all') return true;
 let dt=new Date(d.created||Date.now()); let now=new Date();
 if(period==='month') return dt.getMonth()===now.getMonth() && dt.getFullYear()===now.getFullYear();
 if(period==='year') return dt.getFullYear()===now.getFullYear();
 if(period==='quarter'){ let q=Math.floor(now.getMonth()/3); let dq=Math.floor(dt.getMonth()/3); return dq===q && dt.getFullYear()===now.getFullYear(); }
 return true;
}
function openForm(j=null){
 document.getElementById('formBg').classList.add('open');
 if(!j){['fId','fName','fPhone','fStyle','fChest','fLength','fWaist','fShoulder','fPrice','fDep','fCost','fDate','fNote'].forEach(id=>document.getElementById(id).value='');return;}
 fId.value=j.id; fName.value=j.name; fPhone.value=j.phone; fStyle.value=j.style; fChest.value=j.chest; fLength.value=j.length; fWaist.value=j.waist; fShoulder.value=j.shoulder; fPrice.value=j.price; fDep.value=j.dep; fCost.value=j.cost||0; fDate.value=j.date; fNote.value=j.note;
}
function closeForm(){document.getElementById('formBg').classList.remove('open');}
function saveJob(){
 let id=fId.value||Date.now().toString();
 let o={id,name:fName.value.trim(),phone:fPhone.value.trim(),style:fStyle.value.trim(),chest:fChest.value,length:fLength.value,waist:fWaist.value,shoulder:fShoulder.value,price:+(fPrice.value||0),dep:+(fDep.value||0),cost:+(fCost.value||0),date:fDate.value,note:fNote.value,status:'pending',created:Date.now()};
 if(!o.name){alert('Enter name');return;}
 let i=DB.findIndex(x=>x.id===id); if(i>=0) DB[i]={...DB[i],...o}; else DB.unshift(o);
 save(); closeForm();
}
function del(id){if(confirm('Delete?')){DB=DB.filter(x=>x.id!==id);save();}}
function toggleDone(id){let j=DB.find(x=>x.id===id);j.status=j.status==='done'?'pending':'done';save();}
function addPay(id){let j=DB.find(x=>x.id===id);let amt=prompt('Add payment ₦? Balance ₦'+(j.price-j.dep));if(amt===null)return;amt=+amt; if(isNaN(amt))return; j.dep+=amt; save();}
function render(){
 let list=DB.filter(periodFilter);
 let total=list.reduce((s,x)=>s+x.price,0); let rec=list.reduce((s,x)=>s+x.dep,0); let out=total-rec;
 let profit=list.reduce((s,x)=>s+ (x.dep - (x.cost||0)),0) + SELL.filter(s=>periodFilter(s)).reduce((a,b)=>a+b.profit,0);
 document.getElementById('showing').textContent=`Showing: ${period==='all'?'All Time':period} (${list.length})`;
 sSales.textContent='₦'+total.toLocaleString(); sRec.textContent='₦'+rec.toLocaleString(); sOut.textContent='₦'+out.toLocaleString(); sProf.textContent='₦'+profit.toLocaleString();
 let q=(search.value||'').toLowerCase();
 let filtered=DB.filter(d=>!q|| (d.name+' '+d.phone+' '+d.style).toLowerCase().includes(q) );
 let h=''; filtered.slice().reverse().forEach(j=>{
   let bal=j.price-j.dep;
   h+=`<div class="job"><div class="row" style="justify-content:space-between"><div><b>${j.name}</b> <span class="small">${j.phone}</span><div class="small">${j.style||''} ${j.date?'• '+j.date:''}</div><div class="small">M: C${j.chest||'-'} L${j.length||'-'} W${j.waist||'-'} S${j.shoulder||'-'}</div></div><span style="font-size:11px;padding:4px 8px;border-radius:20px;background:${j.status==='done'?'#dcfce7':'#fef3c7'};font-weight:700">${j.status}</span></div><div class="small" style="margin-top:6px">Price ₦${j.price.toLocaleString()} • Paid ₦${j.dep.toLocaleString()} • <b style="color:${bal<=0?'green':'#b45309'}">Bal ₦${bal.toLocaleString()}</b></div><div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn btn-light" onclick="openForm(DB.find(x=>x.id==='${j.id}'))">✏️ Edit</button><button class="btn btn-green" style="padding:6px 10px" onclick="addPay('${j.id}')">💰 Payment</button><button class="btn btn-light" onclick="toggleDone('${j.id}')">${j.status==='done'?'↩ Pending':'✓ Done'}</button><button class="btn btn-light" onclick="del('${j.id}')">🗑️</button></div></div>`;
 });
 panelCustomers.innerHTML=h||'<div class="card" style="text-align:center;color:#777">No customers. Tap +</div>';
 let bulkH=`<div class="card"><b>Bulk Actions</b><div class="small">Select customers and do action together</div><div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn btn-dark" onclick="bulkDone()">✓ Mark Done</button><button class="btn btn-light" onclick="bulkPending()">↩ Mark Pending</button><button class="btn btn-light" onclick="bulkDelete()">🗑️ Delete Selected</button><button class="btn btn-green" onclick="bulkWhats()">📲 WhatsApp Reminder</button></div></div>`;
 filtered.forEach(j=>{ let checked=selectedBulk.has(j.id)?'checked':''; bulkH+=`<div class="job"><label class="row"><input type="checkbox" ${checked} onchange="toggleBulk('${j.id}')"><div><b>${j.name}</b> <span class="small">${j.phone} - ${j.style}</span><div class="small">Bal ₦${(j.price-j.dep).toLocaleString()} • ${j.status}</div></div></label></div>`; });
 panelBulk.innerHTML=bulkH;
 let monthly={}; DB.forEach(j=>{let d=new Date(j.created);let k=d.getFullYear()+'-'+(d.getMonth()+1);monthly[k]=(monthly[k]||0)+j.dep;});
 let mkeys=Object.keys(monthly).slice(-6);
 let reportH=`<div class="card"><b>Report Summary</b><div class="small">Profit = Received - Cost</div><div style="margin-top:10px">${mkeys.map(k=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid #eee;padding:6px 0"><span class="small">${k}</span><b>₦${monthly[k].toLocaleString()}</b></div>`).join('')||'<span class="small">No data yet</span>'}</div><div class="row" style="margin-top:10px"><button class="btn btn-dark" style="flex:1" onclick="exportCSV()">📄 Export CSV</button><button class="btn btn-light" style="flex:1" onclick="window.print()">🖨️ Print</button></div></div>`;
 reportH+=`<div class="card" style="margin-top:10px"><b>Top Customers</b>${DB.slice().sort((a,b)=>b.dep-a.dep).slice(0,5).map(j=>`<div class="row" style="justify-content:space-between;padding:6px 0"><span>${j.name}</span><b>₦${j.dep.toLocaleString()}</b></div>`).join('')}</div>`;
 panelReport.innerHTML=reportH;
 let sellH=`<div class="card"><b>Sell Ready Items</b><div class="small">Sell fabric, ready wear, accessories</div><div class="grid2" style="margin-top:8px"><input class="inp" id="sellItem" placeholder="Item name"><input class="inp" type="number" id="sellPrice" placeholder="Price ₦"><input class="inp" type="number" id="sellCost" placeholder="Cost ₦"><button class="btn btn-dark" onclick="addSell()">+ Add Sale</button></div></div>`;
 SELL.forEach((s,i)=>{sellH+=`<div class="job"><div class="row" style="justify-content:space-between"><div><b>${s.item}</b><div class="small">${new Date(s.created).toLocaleDateString()} • Cost ₦${s.cost} • Price ₦${s.price}</div></div><b style="color:green">+₦${s.profit.toLocaleString()}</b></div><button class="btn btn-light" style="margin-top:6px" onclick="SELL.splice(${i},1);save()">🗑️ Delete</button></div>`});
 panelSell.innerHTML=sellH;
}
function toggleBulk(id){ if(selectedBulk.has(id)) selectedBulk.delete(id); else selectedBulk.add(id); render(); }
function bulkDone(){ DB.forEach(j=>{if(selectedBulk.has(j.id)) j.status='done';}); save(); selectedBulk.clear();}
function bulkPending(){ DB.forEach(j=>{if(selectedBulk.has(j.id)) j.status='pending';}); save(); selectedBulk.clear();}
function bulkDelete(){ if(!confirm('Delete '+selectedBulk.size+' selected?')) return; DB=DB.filter(j=>!selectedBulk.has(j.id)); save(); selectedBulk.clear();}
function bulkWhats(){ let msg=DB.filter(j=>selectedBulk.has(j.id)).map(j=>`${j.name}: Bal ₦${j.price-j.dep} due ${j.date||''}`).join('\n'); if(!msg){alert('Select customers first');return;} let url='https://wa.me/?text='+encodeURIComponent('Tailor Reminder:\n'+msg); window.open(url,'_blank'); }
function addSell(){ let item=sellItem.value.trim(); let price=+(sellPrice.value||0); let cost=+(sellCost.value||0); if(!item||!price){alert('Enter item and price');return;} SELL.unshift({item,price,cost,profit:price-cost,created:Date.now()}); save(); sellItem.value=''; sellPrice.value=''; sellCost.value=''; }
function exportCSV(){ let rows=[['Name','Phone','Style','Price','Deposit','Balance','Status','Date']]; DB.forEach(j=>rows.push([j.name,j.phone,j.style,j.price,j.dep,j.price-j.dep,j.status,j.date])); let csv=rows.map(r=>r.map(v=>`"${v}"`).join(',')).join('\n'); let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='tailor-report.csv'; a.click(); }
document.querySelectorAll('#periodPills button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#periodPills button').forEach(x=>x.className='btn btn-light'); b.className='btn pill-active'; period=b.dataset.p; render();});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); tab=b.dataset.tab; ['Customers','Bulk','Report','Sell'].forEach(t=>{document.getElementById('panel'+t).style.display=(t.toLowerCase()===tab?'block':'none')});});
search.oninput=render; render();
</script>
</body>
</html>
