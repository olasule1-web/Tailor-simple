  if(!ok) continue;
  if(search!==""&&c.name.toLowerCase().indexOf(search.toLowerCase())==-1&&c.type.toLowerCase().indexOf(search.toLowerCase())==-1) continue;
  out.push(c);
 }
 return out;
}

  }
 } else if(tab==='Bulk'){

function saveNewCustomer(){

function openBulkModal(id){
 var bj=null; if(id){ for(var i=0;i<bulkJobs.length;i++){ if(bulkJobs[i].id===id){ bj=bulkJobs[i]; break; } } }
 var h='<b>👕 '+(bj?'Edit Bulk Sewing':'New Bulk Sewing')+'</b><div class="small">Uniforms, Aso-Ebi, bulk orders - many pieces</div><div style="margin-top:10px"><div class="grid2"><input id="b_client" class="inp-light" placeholder="Client / School e.g. Grace School" value="'+(bj?bj.client:'')+'"><input id="b_phone" class="inp-light" placeholder="Phone" value="'+(bj?bj.phone:'')+'"></div><input id="b_style" class="inp-light" placeholder="Style e.g. School Uniform" value="'+(bj?bj.style:'')+'"><div class="grid2"><input id="b_qty" type="number" class="inp-light" placeholder="Qty e.g. 30" value="'+(bj?bj.qty:'')+'" oninput="calcBulkTotal()"><input id="b_pricePer" type="number" class="inp-light" placeholder="Price per piece e.g. 5000" value="'+(bj?bj.pricePer:'')+'" oninput="calcBulkTotal()"></div><div class="grid2"><input id="b_total" class="inp-light" placeholder="Total auto" readonly value="'+(bj?'₦'+bj.total:'')+'"><input id="b_paid" type="number" class="inp-light" placeholder="Deposit ₦" value="'+(bj?bj.paid:'')+'"></div><div class="grid2"><input id="b_cost" type="number" class="inp-light" placeholder="Cost per piece" value="'+(bj?bj.costPer:'')+'"><input id="b_date" type="date" class="inp-light" value="'+(bj?bj.date:new Date().toISOString().slice(0,10))+'"></div><select id="b_prog" class="inp-light"><option '+(bj&&bj.prog==='Not Started'?'selected':'')+'>Not Started</option><option '+(bj&&bj.prog==='Cutting'?'selected':'')+'>Cutting</option><option '+(bj&&bj.prog==='Sewing'?'selected':'')+'>Sewing</option><option '+(bj&&bj.prog==='Finishing'?'selected':'')+'>Finishing</option><option '+(bj&&bj.prog==='Ready'?'selected':'')+'>Ready</option><option '+(bj&&bj.prog==='Delivered'?'selected':'')+'>Delivered</option></select><input id="b_note" class="inp-light" placeholder="Notes e.g. 10 large, 20 medium" value="'+(bj?bj.note:'')+'"><button class="btn btn-green" style="width:100%;padding:14px;margin-top:8px" onclick="saveBulk('+(bj?bj.id:'null')+')">Save Bulk Job</button><button class="btn" style="width:100%;margin-top:8px;background:#eee" onclick="closeModal()">Cancel</button></div>';
 document.getElementById('modalBox').innerHTML=h; document.getElementById('modal').style.display='flex';
}
function calcBulkTotal(){ var q=parseInt(document.getElementById('b_qty').value)||0; var p=parseInt(document.getElementById('b_pricePer').value)||0; document.getElementById('b_total').value=q&&p?'₦'+(q*p):''; document.getElementById('b_total').dataset.val=q*p; }
function saveBulk(editId){
 var client=document.getElementById('b_client').value; if(!client){alert("Enter client");return;}
 var qty=parseInt(document.getElementById('b_qty').value)||0; var pricePer=parseInt(document.getElementById('b_pricePer').value)||0; if(!qty||!pricePer){alert("Enter qty and price per piece");return;}
 var total=qty*pricePer; var paid=parseInt(document.getElementById('b_paid').value)||0; var costPer=parseInt(document.getElementById('b_cost').value)||0; var date=document.getElementById('b_date').value; var prog=document.getElementById('b_prog').value; var note=document.getElementById('b_note').value; var phone=document.getElementById('b_phone').value; var style=document.getElementById('b_style').value||"Bulk";
 var obj={id:editId||Date.now(),client:client,phone:phone,style:style,qty:qty,pricePer:pricePer,total:total,paid:paid,costPer:costPer,costTotal:qty*costPer,date:date,prog:prog,note:note,created:Date.now()};
 if(editId){ for(var i=0;i<bulkJobs.length;i++){ if(bulkJobs[i].id===editId){ bulkJobs[i]=obj; break; } } } else { bulkJobs.unshift(obj); }
 saveBulkSell(); closeModal(); showList();
}
function openBulkPayModal(id){ var bj=null; for(var i=0;i<bulkJobs.length;i++){ if(bulkJobs[i].id===id){ bj=bulkJobs[i]; break; } } if(!bj) return; var left=bj.total-bj.paid; var h='<b>💰 Payment - '+bj.client+'</b><div class="small">Total ₦'+bj.total+' | Paid ₦'+bj.paid+' | Left ₦'+left+'</div><input id="bp_amount" type="number" class="inp-light" placeholder="Amount e.g. 10000"><div class="grid2" style="margin-top:8px"><button class="btn" style="background:#e8f5e9;color:#16a34a" onclick="document.getElementById(\'bp_amount\').value=5000">₦5000</button><button class="btn" style="background:#e8f5e9;color:#16a34a" onclick="document.getElementById(\'bp_amount\').value='+left+'">Pay All ₦'+left+'</button></div><button class="btn btn-green" style="width:100%;padding:14px;margin-top:12px" onclick="saveBulkPay('+id+')">Confirm</button><button class="btn" style="width:100%;margin-top:8px;background:#eee" onclick="closeModal()">Cancel</button>'; document.getElementById('modalBox').innerHTML=h; document.getElementById('modal').style.display='flex'; }
function saveBulkPay(id){ var amt=parseInt(document.getElementById('bp_amount').value)||0; if(amt<=0){alert("Enter amount");return;} for(var i=0;i<bulkJobs.length;i++){ if(bulkJobs[i].id===id){ bulkJobs[i].paid+=amt; if(bulkJobs[i].paid>bulkJobs[i].total) bulkJobs[i].paid=bulkJobs[i].total; break; } } saveBulkSell(); closeModal(); showList(); }
function deleteBulk(id){ if(confirm("Delete this bulk job?")){ var arr=[]; for(var i=0;i<bulkJobs.length;i++){ if(bulkJobs[i].id!==id) arr.push(bulkJobs[i]); } bulkJobs=arr; saveBulkSell(); showList(); } }
function openSellModal(){ var h='<b>🛍️ New Sale - Ready Item</b><div style="margin-top:10px"><input id="s_item" class="inp-light" placeholder="Item e.g. Fabric, Ready Kaftan"><input id="s_price" type="number" class="inp-light" placeholder="Selling Price ₦"><input id="s_cost" type="number" class="inp-light" placeholder="Cost ₦"><button class="btn btn-green" style="width:100%;padding:14px;margin-top:8px" onclick="saveSell()">Save Sale</button><button class="btn" style="width:100%;margin-top:8px;background:#eee" onclick="closeModal()">Cancel</button></div>'; document.getElementById('modalBox').innerHTML=h; document.getElementById('modal').style.display='flex'; }
function saveSell(){ var item=document.getElementById('s_item').value; var price=parseInt(document.getElementById('s_price').value)||0; var cost=parseInt(document.getElementById('s_cost').value)||0; if(!item||!price){alert("Enter item and price");return;} sellItems.unshift({id:Date.now(),item:item,price:price,cost:cost,profit:price-cost,created:Date.now()}); saveBulkSell(); closeModal(); showList(); }
function quickSell(){ var item=document.getElementById('sellItem').value; var price=parseInt(document.getElementById('sellPrice').value)||0; var cost=parseInt(document.getElementById('sellCost').value)||0; if(!item||!price){alert("Enter item and price");return;} sellItems.unshift({id:Date.now(),item:item,price:price,cost:cost,profit:price-cost,created:Date.now()}); saveBulkSell(); showList(); }
function deleteSell(id){ if(confirm("Delete?")){ var arr=[]; for(var i=0;i<sellItems.length;i++){ if(sellItems[i].id!==id) arr.push(sellItems[i]); } sellItems=arr; saveBulkSell(); showList(); } }
function exportCSV(){ var rows=[["Type","Name","Style","Qty","Total","Paid","Balance","Date"]]; for(var i=0;i<customers.length;i++){ rows.push(["Single",customers[i].name,customers[i].type,1,customers[i].total,customers[i].paid,customers[i].total-customers[i].paid,customers[i].date]); } for(var j=0;j<bulkJobs.length;j++){ rows.push(["Bulk",bulkJobs[j].client,bulkJobs[j].style,bulkJobs[j].qty,bulkJobs[j].total,bulkJobs[j].paid,bulkJobs[j].total-bulkJobs[j].paid,bulkJobs[j].date]); } var csv=""; for(var r=0;r<rows.length;r++){ csv+=rows[r].join(",")+"\n"; } var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="tailor-report.csv"; a.click(); }
function openPayModal(id){
 var c=null; for(var i=0;i<customers.length;i++){ if(customers[i].id===id){ c=customers[i]; break; } }
 if(!c) return; var left=c.total-c.paid;
 var h='<b>💰 '+tr('addPay')+' - '+c.name+'</b><div class="small" style="margin:6px 0">Total: ₦'+c.total+' | Paid: ₦'+c.paid+' | Left: ₦'+left+'</div><input id="pay_amount" type="number" class="inp-light" placeholder="'+tr('amount')+' e.g. 5000"><div class="grid2" style="margin-top:8px"><button class="btn" style="background:#e8f5e9;color:#16a34a;border:1px solid #16a34a" onclick="setPay(5000)">₦5000</button><button class="btn" style="background:#e8f5e9;color:#16a34a;border:1px solid #16a34a" onclick="setPay('+left+')">Pay All</button></div><button class="btn btn-green" style="width:100%;padding:14px;margin-top:12px" onclick="savePayment('+id+')">'+tr('confirm')+'</button><button class="btn" style="width:100%;margin-top:8px;background:#eee" onclick="closeModal()">'+tr('cancel')+'</button>';
 document.getElementById('modalBox').innerHTML=h; document.getElementById('modal').style.display='flex';
}
function setPay(v){ document.getElementById('pay_amount').value=v; }
function savePayment(id){
 var amt=parseInt(document.getElementById('pay_amount').value)||0; if(amt<=0){alert("Enter amount");return;}
 for(var i=0;i<customers.length;i++){ if(customers[i].id===id){ customers[i].paid+=amt; if(customers[i].paid>customers[i].total) customers[i].paid=customers[i].total; break; } }
 closeModal(); showList();
}
function closeModal(){ document.getElementById('modal').style.display='none'; }
function openCustomer(id){ for(var i=0;i<customers.length;i++){ if(customers[i].id===id){ current=customers[i]; break; } } edit=false; renderMeasure(); }
function renderMeasure(){
 var c=current;
 var h='<div style="max-width:480px;margin:0 auto;background:#0f172a;min-height:100vh;color:white"><div style="padding:12px;display:flex;gap:10px;align-items:center;position:sticky;top:0;background:#0f172a;border-bottom:1px solid #1e293b;z-index:5"><button onclick="showList()" style="background:none;border:none;color:white;font-size:22px">←</button><div><b>'+c.name+'</b><div style="font-size:10px;color:#94a3b8">Measurements ONLY</div></div><button onclick="edit=!edit;renderMeasure()" style="margin-left:auto;width:36px;height:36px;background:#10b981;border-radius:50%;border:none">✏️</button></div>';
 h+='<div style="padding:12px;border-bottom:1px solid #1e293b"><span style="color:#10b981;font-weight:bold;border-bottom:2px solid #10b981;padding-bottom:10px">'+tr('measure')+'</span></div><div style="padding:12px;display:flex;flex-direction:column;gap:12px;padding-bottom:90px">';
 h+='<div class="m-card"><b>📏 '+tr('upper')+'</b><div class="grid2" style="margin-top:10px"><div><div class="small" style="color:#94a3b8">Bust</div><input id="bust" value="'+c.bust+'" '+(edit?'':'disabled')+' class="m-inp"></div><div><div class="small" style="color:#94a3b8">Shoulder</div><input id="shoulder" value="'+c.shoulder+'" '+(edit?'':'disabled')+' class="m-inp"></div><div><div class="small" style="color:#94a3b8">Sleeve</div><input id="sleeve" value="'+c.sleeve+'" '+(edit?'':'disabled')+' class="m-inp"></div><div><div class="small" style="color:#94a3b8">Top Length</div><input id="topLen" value="'+c.topLen+'" '+(edit?'':'disabled')+' class="m-inp"></div></div></div>';
 h+='<div class="m-card"><b>📏 '+tr('lower')+'</b><div class="grid2" style="margin-top:10px"><div><div class="small" style="color:#94a3b8">Waist</div><input id="waist" value="'+c.waist+'" '+(edit?'':'disabled')+' class="m-inp"></div><div><div class="small" style="color:#94a3b8">Hip</div><input id="hip" value="'+c.hip+'" '+(edit?'':'disabled')+' class="m-inp"></div><div style="grid-column:span 2"><div class="small" style="color:#94a3b8">Trouser</div><input id="trouser" value="'+c.trouser+'" '+(edit?'':'disabled')+' class="m-inp"></div></div></div>';
 h+='<div class="m-card"><b>📏 '+tr('extra')+'</b><div style="margin-top:10px"><div class="small" style="color:#94a3b8">Neck</div><input id="neck" value="'+c.neck+'" '+(edit?'':'disabled')+' class="m-inp"></div><div style="margin-top:16px;border-top:2px solid #10b981;padding-top:12px"><div style="display:flex;justify-content:space-between;align-items:center"><b style="color:#10b981">📐 '+tr('customTitle')+'</b>'+(edit?'<button onclick="addCustom()" style="background:#10b981;color:white;border:none;padding:6px 10px;border-radius:20px;font-size:11px">'+tr('addCustom')+'</button>':'')+'</div><div class="small" style="color:#10b981;margin:6px 0">Add ANY measurement</div>';
 for(var j=0;j<c.custom.length;j++){
  h+='<div style="display:flex;gap:6px;margin-bottom:8px"><input value="'+c.custom[j].n+'" id="cn'+j+'" placeholder="Name e.g. Knee" '+(edit?'':'disabled')+' style="flex:1;background:#0f172a;border:1px solid #10b981;border-radius:10px;padding:10px;color:white"><input value="'+c.custom[j].v+'" id="cv'+j+'" placeholder="Value" '+(edit?'':'disabled')+' style="width:60px;background:#0f172a;border:1px solid #334155;border-radius:10px;padding:10px;color:white;text-align:center">'+(edit?'<button onclick="delCustom('+j+')" style="width:28px;background:#7f1d1d;border:none;border-radius:50%;color:white">×</button>':'')+'</div>';
 }
 if(c.custom.length===0){ h+='<div style="text-align:center;padding:16px;border:2px dashed #10b981;border-radius:12px;color:#10b981">'+tr('noCustom')+'</div>'; }
 if(edit){ h+='<button onclick="addCustom()" style="width:100%;margin-top:10px;padding:12px;border:2px dashed #10b981;background:rgba(16,185,129,0.1);color:#10b981;border-radius:12px;font-weight:bold">'+tr('addAny')+'</button>'; }
 h+='</div></div></div><div style="position:fixed;bottom:0;left:0;right:0;padding:12px;background:#0f172a;border-top:1px solid #1e293b"><div style="max-width:480px;margin:0 auto">'+(edit?'<button class="btn btn-green" style="width:100%;padding:14px" onclick="saveMeasure()">'+tr('save')+'</button>':'<button class="btn" style="width:100%;padding:14px;background:#14532d;color:#6ee7b7;border:none;border-radius:12px" onclick="edit=true;renderMeasure()">'+tr('edit')+'</button>')+'</div></div></div>';
 document.getElementById('app').innerHTML=h;
}
function addCustom(){ current.custom.push({n:"",v:""}); renderMeasure(); edit=true; }
function delCustom(i){ current.custom.splice(i,1); renderMeasure(); }
function saveMeasure(){
 current.bust=document.getElementById('bust').value; current.shoulder=document.getElementById('shoulder').value; current.sleeve=document.getElementById('sleeve').value; current.topLen=document.getElementById('topLen').value; current.waist=document.getElementById('waist').value; current.hip=document.getElementById('hip').value; current.trouser=document.getElementById('trouser').value; current.neck=document.getElementById('neck').value;
 for(var j=0;j<current.custom.length;j++){ var nn=document.getElementById('cn'+j); var vv=document.getElementById('cv'+j); if(nn) current.custom[j].n=nn.value; if(vv) current.custom[j].v=vv.value; }
 edit=false; renderMeasure();
}
function deleteCustomer(id){ if(confirm("Delete?")){ var arr=[]; for(var i=0;i<customers.length;i++){ if(customers[i].id!==id) arr.push(customers[i]); } customers=arr; showList(); } }

showLock();
</script>
</body>
