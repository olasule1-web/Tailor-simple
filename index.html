<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tailor Keeper Luky Full</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#f2f2f7;color:#111}.top{position:sticky;top:0;z-index:20;background:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}.logo{display:flex;gap:10px;align-items:center}.ic{width:40px;height:40px;background:#111;border-radius:12px;display:grid;place-items:center;font-size:20px;color:#fff}.h{font-weight:800;font-size:15px}.sub{font-size:11px;color:#888}.btn{border:0;border-radius:999px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer}.btn-dark{background:#111;color:#fff}.btn-light{background:#e9e9ee}.pills{display:flex;gap:8px;overflow:auto;padding:10px 14px}.pill{border:0;background:#e8e8ef;padding:9px 16px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer}.pill.active{background:#111;color:#fff}.wrap{max-width:560px;margin:0 auto;padding:0 14px 100px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 4px 18px rgba(0,0,0,.04)}.lab{font-size:10px;color:#888;letter-spacing:.7px;font-weight:700;text-transform:uppercase}.val{font-weight:800;font-size:20px;margin-top:4px}.search{width:100%;padding:14px 16px;border-radius:16px;border:0;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.04);outline:0}.tabs{display:flex;background:#e8e8ef;border-radius:999px;padding:4px;gap:4px;margin:14px 0}.tabs button{flex:1;border:0;padding:11px;border-radius:999px;font-weight:700;font-size:13px;background:transparent;cursor:pointer;color:#666}.tabs button.active{background:#111;color:#fff}.job{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.04)}.small{font-size:12px;color:#777}.b{font-weight:700}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);display:none;place-items:center;z-index:60;padding:14px}.modal-bg.open{display:grid}.modal{width:100%;max-width:480px;background:#fff;border-radius:24px;padding:18px;max-height:92vh;overflow:auto}.inp{width:100%;padding:12px 14px;border:1px solid #e6e6ef;border-radius:12px;margin-top:6px;outline:0;background:#f9f9fb}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:8px;align-items:center}.fab{position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;background:#111;color:#fff;font-size:28px;border:0;box-shadow:0 10px 30px rgba(0,0,0,.3);cursor:pointer;z-index:30}#loginPage{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#f8f8fb,#eef0f6);display:grid;place-items:center;padding:20px}.loginCard{background:#fff;border-radius:28px;padding:28px 22px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.1);text-align:center}</style></head><body>
<div id="loginPage"><div class="loginCard"><div style="width:64px;height:64px;background:#111;border-radius:18px;display:grid;place-items:center;font-size:30px;margin:0 auto">✂️</div><div style="font-weight:800;font-size:22px;margin-top:14px">Tailor Keeper</div><div class="small" style="margin-top:4px">Luky - Full • Secure Login</div><input class="inp" id="pinInput" type="password" placeholder="Enter PIN (default 1234)" style="margin-top:20px;text-align:center;letter-spacing:3px;padding:14px;border-radius:14px"><button class="btn btn-dark" style="width:100%;margin-top:14px;padding:14px;border-radius:14px" onclick="doLogin()">Login</button></div></div>
<div class="top"><div class="logo"><div class="ic">✂️</div><div><div class="h">Tailor Keeper</div><div class="sub">Luky - Full</div></div></div><div class="row"><button class="btn btn-light" onclick="doLogout()">Logout</button></div></div>
<div class="pills" id="periodPills"><button class="pill active" data-p="all">All Time</button><button class="pill" data-p="month">This Month</button><button class="pill" data-p="quarter">Quarter</button><button class="pill" data-p="year">Year</button></div>
<div class="wrap"><div class="small" id="showing">Showing: All Time (0)</div><div class="stats"><div class="card"><div class="lab">Total Sales</div><div class="val" id="sSales">₦0</div></div><div class="card"><div class="lab">Received</div><div class="val" id="sRec">₦0</div></div><div class="card"><div class="lab">Outstanding</div><div class="val" id="sOut">₦0</div></div><div class="card"><div class="lab">Real Profit</div><div class="val" id="sProf" style="color:#16a34a">₦0</div></div></div><input class="search" id="search" placeholder="🔍 Search customers..."><div class="tabs"><button data-tab="customers" class="active">Customers</button><button data-tab="bulk">Bulk</button><button data-tab="report">Report</button><button data-tab="sell">Sell</button></div><div id="panelCustomers"></div><div id="panelBulk" style="display:none"></div><div id="panelReport" style="display:none"></div><div id="panelSell" style="display:none"></div></div>
<button class="fab" onclick="openForm(null,'customer')">+</button>
<div class="modal-bg" id="formBg"><div class="modal"><div class="row" style="justify-content:space-between"><h3 style="margin:0" id="formTitle">New Job</h3><button class="btn btn-light" onclick="closeForm()">✕</button></div><div id="formCustomer"><div class="grid2"><div><label class="small b">Customer Name</label><input class="inp" id="fName"></div><div><label class="small b">Phone</label><input class="inp" id="fPhone"></div></div><label class="small b">Style</label><input class="inp" id="fStyle"><div class="grid2"><div><label class="small b">Chest</label><input class="inp" id="fChest"></div><div><label class="small b">Length</label><input class="inp" id="fLength"></div><div><label class="small b">Waist</label><input class="inp" id="fWaist"></div><div><label class="small b">Shoulder</label><input class="inp" id="fShoulder"></div></div><div class="grid2"><div><label class="small b">Price ₦</label><input class="inp" type="number" id="fPrice"></div><div><label class="small b">Deposit ₦</label><input class="inp" type="number" id="fDep"></div><div><label class="small b">Cost ₦</label><input class="inp" type="number" id="fCost"></div><div><label class="small b">Date</label><input class="inp" type="date" id="fDate"></div></div><label class="small b">Note</label><input class="inp" id="fNote"></div><div id="formBulk" style="display:none"><div class="grid2"><div><label class="small b">Client / School</label><input class="inp" id="bClient"></div><div><label class="small b">Phone</label><input class="inp" id="bPhone"></div></div><label class="small b">Bulk Style</label><input class="inp" id="bStyle" placeholder="School Uniform, Aso-Ebi"><div class="grid2"><div><label class="small b">Qty</label><input class="inp" type="number" id="bQty" oninput="calcBulk()"></div><div><label class="small b">Price Per Piece</label><input class="inp" type="number" id="bPricePer" oninput="calcBulk()"></div></div><div class="grid2"><div><label class="small b">Total</label><input class="inp" id="bTotal" readonly></div><div><label class="small b">Deposit</label><input class="inp" type="number" id="bDep"></div></div><div class="grid2"><div><label class="small b">Cost Per Piece</label><input class="inp" type="number" id="bCostPer"></div><div><label class="small b">Deadline</label><input class="inp" type="date" id="bDate"></div></div><label class="small b">Progress</label><select class="inp" id="bProg"><option>Not Started</option><option>Cutting</option><option>Sewing</option><option>Finishing</option><option>Ready</option><option>Delivered</option></select><label class="small b">Notes</label><input class="inp" id="bNote"></div><button class="btn btn-dark" style="width:100%;margin-top:16px;padding:14px;border-radius:14px" onclick="saveCurrent()">Save Job</button><input type="hidden" id="fId"><input type="hidden" id="fType"></div></div>
<script>
function loadDB(){let ks=['tailor-simple-v2','tailor-full-v3','tailor-keeper','tailorDB','tailor-simple','tailor'];for(let k of ks){let v=localStorage.getItem(k);if(v){try{let a=JSON.parse(v);if(Array.isArray(a)&&a.length>0) return a;}catch(e){}}}return[];}
let DB=loadDB();let BULK=JSON.parse(localStorage.getItem('tailor-bulk-v3')||'[]');let SELL=JSON.parse(localStorage.getItem('tailor-sell-v3')||'[]');let period='all';
function save(){localStorage.setItem('tailor-simple-v2',JSON.stringify(DB));localStorage.setItem('tailor-bulk-v3',JSON.stringify(BULK));localStorage.setItem('tailor-sell-v3',JSON.stringify(SELL));render();}
function periodFilter(d){if(period==='all') return true;let dt=new Date(d.created||Date.now());let now=new Date();if(period==='month') return dt.getMonth()===now.getMonth()&&dt.getFullYear()===now.getFullYear();if(period==='year') return dt.getFullYear()===now.getFullYear();if(period==='quarter'){let q=Math.floor(now.getMonth()/3);let dq=Math.floor(dt.getMonth()/3);return dq===q&&dt.getFullYear()===now.getFullYear();}return true;}
function doLogin(){let p=pinInput.value.trim();let s=localStorage.getItem('tk_pin')||'1234';if(p===s||p===''){localStorage.setItem('tk_logged','1');loginPage.style.display='none';render();}else alert('Wrong PIN 1234');}
function doLogout(){localStorage.removeItem('tk_logged');location.reload();}
if(localStorage.getItem('tk_logged')==='1'){loginPage.style.display='none';}
function openForm(e=null,t='customer'){formBg.classList.add('open');fType.value=t;if(t==='bulk'){formTitle.textContent=e?'Edit Bulk':'New Bulk Sewing';formCustomer.style.display='none';formBulk.style.display='block';if(!e){['bClient','bPhone','bStyle','bQty','bPricePer','bTotal','bDep','bCostPer','bDate','bNote'].forEach(id=>document.getElementById(id).value='');fId.value='';bProg.value='Not Started';return;}fId.value=e.id;bClient.value=e.client;bPhone.value=e.phone;bStyle.value=e.style;bQty.value=e.qty;bPricePer.value=e.pricePer;bTotal.value='₦'+e.total.toLocaleString();bDep.value=e.dep;bCostPer.value=e.costPer;bDate.value=e.date;bNote.value=e.note;bProg.value=e.prog;}else{formTitle.textContent=e?'Edit Job':'New Job';formBulk.style.display='none';formCustomer.style.display='block';if(!e){['fId','fName','fPhone','fStyle','fChest','fLength','fWaist','fShoulder','fPrice','fDep','fCost','fDate','fNote'].forEach(id=>document.getElementById(id).value='');return;}fId.value=e.id;fName.value=e.name;fPhone.value=e.phone;fStyle.value=e.style;fChest.value=e.chest;fLength.value=e.length;fWaist.value=e.waist;fShoulder.value=e.shoulder;fPrice.value=e.price;fDep.value=e.dep;fCost.value=e.cost||0;fDate.value=e.date;fNote.value=e.note;}}
function closeForm(){formBg.classList.remove('open');}
function calcBulk(){let q=+(bQty.value||0);let p=+(bPricePer.value||0);bTotal.value=q*p?'₦'+(q*p).toLocaleString():'';}
function saveCurrent(){if(fType.value==='bulk') saveBulk(); else saveJob();}
function saveJob(){let id=fId.value||Date.now().toString();let o={id,name:fName.value.trim(),phone:fPhone.value.trim(),style:fStyle.value.trim(),chest:fChest.value,length:fLength.value,waist:fWaist.value,shoulder:fShoulder.value,price:+(fPrice.value||0),dep:+(fDep.value||0),cost:+(fCost.value||0),date:fDate.value,note:fNote.value,status:'pending',created:Date.now()};if(!o.name){alert('Enter name');return;}let i=DB.findIndex(x=>x.id===id);if(i>=0) DB[i]={...DB[i],...o};else DB.unshift(o);save();closeForm();}
function saveBulk(){let id=fId.value||Date.now().toString();let qty=+(bQty.value||0);let pp=+(bPricePer.value||0);let tot=qty*pp;let o={id,client:bClient.value.trim(),phone:bPhone.value.trim(),style:bStyle.value.trim(),qty,pricePer:pp,total:tot,dep:+(bDep.value||0),costPer:+(bCostPer.value||0),costTotal:qty*(+(bCostPer.value||0)),date:bDate.value,note:bNote.value.trim(),prog:bProg.value,status:'pending',created:Date.now()};if(!o.client||!qty){alert('Enter client and qty');return;}let i=BULK.findIndex(x=>x.id===id);if(i>=0) BULK[i]={...BULK[i],...o};else BULK.unshift(o);save();closeForm();}
function del(id){if(confirm('Delete?')){DB=DB.filter(x=>x.id!==id);save();}}
function delBulk(id){if(confirm('Delete bulk?')){BULK=BULK.filter(x=>x.id!==id);save();}}
function toggleDone(id){let j=DB.find(x=>x.id===id);j.status=j.status==='done'?'pending':'done';save();}
function addPay(id){let j=DB.find(x=>x.id===id);let a=prompt('Add payment ₦? Balance ₦'+(j.price-j.dep));if(a===null) return;a=+a;if(!a) return;j.dep+=a;save();}
function addPayBulk(id){let j=BULK.find(x=>x.id===id);let a=prompt('Add payment ₦? Balance ₦'+(j.total-j.dep));if(a===null) return;a=+a;if(!a) return;j.dep+=a;save();}
function render(){let list=DB.filter(periodFilter);let bulkList=BULK.filter(periodFilter);let sellList=SELL.filter(periodFilter);let total=list.reduce((s,x)=>s+x.price,0)+bulkList.reduce((s,x)=>s+x.total,0);let rec=list.reduce((s,x)=>s+x.dep,0)+bulkList.reduce((s,x)=>s+x.dep,0)+sellList.reduce((s,x)=>s+x.price,0);let out=total-rec;let prof=list.reduce((s,x)=>s+(x.dep-(x.cost||0)),0)+bulkList.reduce((s,x)=>s+(x.dep-(x.costTotal||0)),0)+sellList.reduce((a,b)=>a+b.profit,0);showing.textContent=`Showing: ${period==='all'?'All Time':period} (${list.length+bulkList.length})`;sSales.textContent='₦'+total.toLocaleString();sRec.textContent='₦'+rec.toLocaleString();sOut.textContent='₦'+out.toLocaleString();sProf.textContent='₦'+prof.toLocaleString();let q=(search.value||'').toLowerCase();let f=DB.filter(d=>!q|| (d.name+' '+d.phone+' '+d.style).toLowerCase().includes(q));let h='';f.slice().reverse().forEach(j=>{let bal=j.price-j.dep;h+=`<div class="job"><div class="row" style="justify-content:space-between"><div><b>${j.name}</b> <span class="small"> ${j.phone}</span><div class="small">${j.style||''} ${j.date?'• '+j.date:''}</div></div><span style="font-size:11px;padding:5px 10px;border-radius:20px;background:${j.status==='done'?'#dcfce7':'#fef3c7'};font-weight:700">${j.status}</span></div><div class="small" style="margin-top:8px">Price ₦${j.price.toLocaleString()} • Paid ₦${j.dep.toLocaleString()} • <b style="color:${bal<=0?'#16a34a':'#b45309'}">Bal ₦${bal.toLocaleString()}</b></div><div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn btn-light" onclick="openForm(DB.find(x=>x.id==='${j.id}'),'customer')">✏️ Edit</button><button class="btn btn-dark" style="padding:7px 12px" onclick="addPay('${j.id}')">💰 Payment</button><button class="btn btn-light" onclick="toggleDone('${j.id}')">${j.status==='done'?'↩ Pending':'✓ Done'}</button><button class="btn btn-light" onclick="del('${j.id}')">🗑️</button></div></div>`;});panelCustomers.innerHTML=h||'<div class="card" style="text-align:center;color:#888;padding:24px">No customers</div>';let bf=BULK.filter(d=>!q|| (d.client+' '+d.style).toLowerCase().includes(q));let bh=`<div class="card"><div class="row" style="justify-content:space-between"><div><b>Bulk Sewing</b><div class="small">Uniforms, Aso-Ebi - many pieces</div></div><button class="btn btn-dark" onclick="openForm(null,'bulk')">+ New Bulk</button></div></div>`;if(bf.length===0) bh+=`<div class="card" style="text-align:center;color:#888;padding:20px">No bulk jobs<br><span class="small">Tap + New Bulk for 20 uniforms</span></div>`;bf.forEach(j=>{let bal=j.total-j.dep;bh+=`<div class="job"><div class="row" style="justify-content:space-between"><div><b>${j.client}</b> <span class="small">${j.phone}</span><div class="small"><b>${j.qty} pcs</b> • ${j.style} • <span style="background:#e0e7ff;padding:2px 8px;border-radius:20px;font-weight:700;font-size:11px">${j.prog}</span></div><div class="small">${j.date?'Due '+j.date:''} ${j.note?'• '+j.note:''}</div></div><span style="background:#111;color:#fff;font-size:11px;padding:5px 10px;border-radius:20px">${j.qty} PCS</span></div><div class="small" style="margin-top:8px">Total ₦${j.total.toLocaleString()} (${j.qty} × ₦${j.pricePer.toLocaleString()}) • Paid ₦${j.dep.toLocaleString()} • <b style="color:${bal<=0?'#16a34a':'#b45309'}">Bal ₦${bal.toLocaleString()}</b></div><div class="row" style="margin-top:10px"><button class="btn btn-light" onclick="openForm(BULK.find(x=>x.id==='${j.id}'),'bulk')">✏️ Edit</button><button class="btn btn-dark" onclick="addPayBulk('${j.id}')">💰 Payment</button><button class="btn btn-light" onclick="delBulk('${j.id}')">🗑️</button></div></div>`;});panelBulk.innerHTML=bh;let monthly={};[...DB,...BULK].forEach(j=>{let d=new Date(j.created);let k=d.getFullYear()+'-'+(d.getMonth()+1);monthly[k]=(monthly[k]||0)+(j.dep||0);});let mk=Object.keys(monthly).sort().slice(-6);let rh=`<div class="card"><b>Monthly Report</b><div class="small">Customers + Bulk</div><div style="margin-top:10px">${mk.map(k=>`<div class="row" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f5"><span class="small">${k}</span><b>₦${monthly[k].toLocaleString()}</b></div>`).join('')||'<div class="small">No data</div>'}</div><div class="row" style="margin-top:14px"><button class="btn btn-dark" style="flex:1;padding:12px" onclick="let rows=[['Type','Name','Style','Qty','Total','Deposit','Balance']];DB.forEach(j=>rows.push(['Single',j.name,j.style,1,j.price,j.dep,j.price-j.dep]));BULK.forEach(j=>rows.push(['Bulk',j.client,j.style,j.qty,j.total,j.dep,j.total-j.dep]));let csv=rows.map(r=>r.join(',')).join('\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='report.csv';a.click()">📄 Export CSV</button><button class="btn btn-light" style="flex:1;padding:12px" onclick="window.print()">🖨️ Print</button></div></div>`;panelReport.innerHTML=rh;let sh=`<div class="card"><b>Sell Ready Items</b><div class="small">Fabric, ready wear</div><div class="grid2" style="margin-top:12px"><input class="inp" id="sellItem" placeholder="Item"><input class="inp" type="number" id="sellPrice" placeholder="Price"><input class="inp" type="number" id="sellCost" placeholder="Cost"><button class="btn btn-dark" onclick="addSell()">+ Sale</button></div></div>`;SELL.forEach((s,i)=>{sh+=`<div class="job"><div class="row" style="justify-content:space-between"><div><b>${s.item}</b><div class="small">${new Date(s.created).toLocaleDateString()} • Cost ₦${s.cost}</div></div><b style="color:#16a34a">+₦${s.profit.toLocaleString()}</b></div><button class="btn btn-light" style="margin-top:6px" onclick="SELL.splice(${i},1);save()">🗑️ Delete</button></div>`;});if(SELL.length===0) sh+=`<div class="card" style="text-align:center;color:#888;padding:20px">No sales yet</div>`;panelSell.innerHTML=sh;}
function addSell(){let it=sellItem.value.trim();let pr=+(sellPrice.value||0);let co=+(sellCost.value||0);if(!it||!pr){alert('Enter item');return;}SELL.unshift({item:it,price:pr,cost:co,profit:pr-co,created:Date.now()});save();sellItem.value='';sellPrice.value='';sellCost.value='';}
document.querySelectorAll('#periodPills .pill').forEach(b=>b.onclick=()=>{document.querySelectorAll('#periodPills .pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');period=b.dataset.p;render();});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['Customers','Bulk','Report','Sell'].forEach(t=>{document.getElementById('panel'+t).style.display=(t.toLowerCase()===b.dataset.tab?'block':'none')});});
search.oninput=render;render();
</script></body></html>
