<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tailor Keeper Luky Full</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#f2f2f7;color:#111}
.top{position:sticky;top:0;z-index:20;background:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.logo{display:flex;gap:8px;align-items:center}.ic{width:36px;height:36px;background:#111;border-radius:10px;display:grid;place-items:center;color:#fff}
.h{font-weight:800;font-size:15px}.sub{font-size:11px;color:#666}
.btn{border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
.btn-dark{background:#111;color:#fff}.btn-light{background:#e9e9ee}.btn-green{background:#16a34a;color:#fff}
.pills{display:flex;gap:8px;overflow:auto;padding:8px 12px}.pill-active{background:#111;color:#fff}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 90px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.lab{font-size:11px;color:#777;text-transform:uppercase}.val{font-weight:800;font-size:17px;margin-top:2px}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid #e5e5ea;background:#fff}
.tabs{display:flex;background:#e9e9ee;border-radius:999px;padding:4px;gap:4px;margin:12px 0}
.tabs button{flex:1;border:0;padding:9px;border-radius:999px;font-weight:700;font-size:13px;background:transparent;cursor:pointer}
.tabs button.active{background:#111;color:#fff}
.job{background:#fff;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.small{font-size:12px;color:#666}.b{font-weight:700}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:50;padding:12px}
.modal-bg.open{display:grid}.modal{width:100%;max-width:480px;background:#fff;border-radius:20px;padding:14px;max-height:92vh;overflow:auto}
.inp{width:100%;padding:11px;border:1px solid #e5e5ea;border-radius:12px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;gap:8px;align-items:center}
#loginPage{position:fixed;inset:0;z-index:100;background:#f2f2f7;display:grid;place-items:center;padding:20px}
.loginCard{background:#fff;border-radius:22px;padding:22px;width:100%;max-width:360px;box-shadow:0 8px 30px rgba(0,0,0,.12);text-align:center}
</style>
</head>
<body>
<div id="loginPage">
  <div class="loginCard">
    <div style="font-size:36px">✂️</div>
    <div style="font-weight:800;font-size:18px;margin-top:6px">Tailor Keeper</div>
    <div class="small">Luky - Full • Secure Login</div>
    <input class="inp" id="pinInput" type="password" placeholder="Enter PIN (default 1234)" style="margin-top:14px;text-align:center;font-size:18px;letter-spacing:4px">
    <button class="btn btn-dark" style="width:100%;margin-top:12px;padding:12px" onclick="doLogin()">Login</button>
  </div>
</div>
<div class="top">
  <div class="logo"><div class="ic">✂️</div><div><div class="h">Tailor Keeper</div><div class="sub">Luky - Full</div></div></div>
  <div class="row"><button class="btn btn-light" id="langBtn">HA</button><button class="btn btn-light" onclick="doLogout()">Logout</button></div>
</div>
<div class="pills" id="periodPills">
  <button class="btn pill-active" data-p="all">All Time</button>
  <button class="btn btn-light" data-p="month">This Month</button>
  <button class="btn btn-light" data-p="quarter">Quarter</button>
  <button class="btn btn-light" data-p="year">Year</button>
</div>
<div class="wrap">
  <div class="small" id="showing">Showing: All Time (0)</div>
  <div class="stats">
    <div class="card"><div class="lab">TOTAL SALES</div><div class="val" id="sSales">₦0</div></div>
    <div class="card"><div class="lab">RECEIVED</div><div class="val" id="sRec">₦0</div></div>
    <div class="card"><div class="lab">OUTSTANDING</div><div class="val" id="sOut">₦0</div></div>
    <div class="card"><div class="lab">REAL PROFIT</div><div class="val" id="sProf" style="color:#16a34a">₦0</div></div>
  </div>
  <input class="search" id="search" placeholder="🔍 Search customers...">
  <div class="tabs">
    <button data-tab="customers" class="active">Customers</button>
    <button data-tab="bulk">Bulk</button>
    <button data-tab="report">Report</button>
    <button data-tab="sell">Sell</button>
  </div>
  <div id="panelCustomers"></div>
  <div id="panelBulk" style="display:none"></div>
  <div id="panelReport" style="display:none"></div>
  <div id="panelSell" style="display:none"></div>
</div>
<button style="position:fixed;bottom:18px;right:18px;width:56px;height:56px;border-radius:50%;background:#111;color:#fff;font-size:26px;border:0;box-shadow:0 8px 20px rgba(0,0,0,.3)" onclick="openForm()">+</button>
<div class="modal-bg" id="formBg"><div class="modal">
  <div class="row" style="justify-content:space-between"><h3 style="margin:0" id="formTitle">New Job</h3><button class="btn btn-light" onclick="closeForm()">✕</button></div>
  <div id="formCustomer">
    <div class="grid2" style="margin-top:8px"><div><label class="small b">Customer Name</label><input class="inp" id="fName"></div><div><label class="small b">Phone</label><input class="inp" id="fPhone"></div></div>
    <label class="small b">Style</label><input class="inp" id="fStyle">
    <div class="grid2"><div><label class="small b">Chest</label><input class="inp" id="fChest"></div><div><label class="small b">Length</label><input class="inp" id="fLength"></div><div><label class="small b">Waist</label><input class="inp" id="fWaist"></div><div><label class="small b">Shoulder</label><input class="inp" id="fShoulder"></div></div>
    <div class="grid2"><div><label class="small b">Price ₦</label><input class="inp" type="number" id="fPrice"></div><div><label class="small b">Deposit ₦</label><input class="inp" type="number" id="fDep"></div><div><label class="small b">Cost</label><input class="inp" type="number" id="fCost"></div><div><label class="small b">Date</label><input class="inp" type="date" id="fDate"></div></div>
    <label class="small b">Note</label><input class="inp" id="fNote">
  </div>
  <div id="formBulk" style="display:none">
    <div class="grid2"><div><label class="small b">Client / School</label><input class="inp" id="bClient"></div><div><label class="small b">Phone</label><input class="inp" id="bPhone"></div></div>
    <label class="small b">Bulk Style</label><input class="inp" id="bStyle">
    <div class="grid2"><div><label class="small b">Qty (Pieces)</label><input class="inp" type="number" id="bQty" oninput="calcBulk()"></div><div><label class="small b">Price Per Piece ₦</label><input class="inp" type="number" id="bPricePer" oninput="calcBulk()"></div></div>
    <div class="grid2"><div><label class="small b">Total Price</label><input class="inp" id="bTotal" readonly></div><div><label class="small b">Deposit ₦</label><input class="inp" type="number" id="bDep"></div></div>
    <div class="grid2"><div><label class="small b">Cost Per Piece</label><input class="inp" type="number" id="bCostPer"></div><div><label class="small b">Deadline</label><input class="inp" type="date" id="bDate"></div></div>
    <label class="small b">Progress</label><select class="inp" id="bProg"><option>Not Started</option><option>Cutting</option><option>Sewing</option><option>Finishing</option><option>Ready</option><option>Delivered</option></select>
    <label class="small b">Notes / Sizes List</label><input class="inp" id="bNote">
  </div>
  <button class="btn btn-dark" style="width:100%;margin-top:12px;padding:12px" onclick="saveCurrent()">Save</button>
  <input type="hidden" id="fId"><input type="hidden" id="fType">
</div></div>
<script>
let DB = JSON.parse(localStorage.getItem('tailor-simple-v2')|| localStorage.getItem('tailor-full-v3')|| localStorage.getItem('tailor-keeper')|| localStorage.getItem('tailorDB')|| '[]');
let BULK = JSON.parse(localStorage.getItem('tailor-bulk-v3')||'[]');
let SELL = JSON.parse(localStorage.getItem('tailor-sell-v3')||'[]');
if(DB.length===0){ let old=localStorage.getItem('tailor-simple'); if(old){ try{DB=JSON.parse(old);}catch(e){} } }
let period='all'; let tab='customers';
function save(){localStorage.setItem('tailor-simple-v2',JSON.stringify(DB));localStorage.setItem('tailor-bulk-v3',JSON.stringify(BULK));localStorage.setItem('tailor-sell-v3',JSON.stringify(SELL)); render();}
function periodFilter(d){ if(period==='all') return true; let dt=new Date(d.created||Date.now()); let now=new Date(); if(period==='month') return dt.getMonth()===now.getMonth()&&dt.getFullYear()===now.getFullYear(); if(period==='year') return dt.getFullYear()===now.getFullYear(); if(period==='quarter'){let q=Math.floor(now.getMonth()/3); let dq=Math.floor(dt.getMonth()/3); return dq===q&&dt.getFullYear()===now.getFullYear();} return true; }
function doLogin(){ let pin=pinInput.value.trim(); let saved=localStorage.getItem('tk_pin')||'1234'; if(pin===saved){ localStorage.setItem('tk_logged','1'); loginPage.style.display='none'; render(); } else alert('Wrong PIN. Default 1234'); }
function doLogout(){ localStorage.removeItem('tk_logged'); location.reload(); }
if(localStorage.getItem('tk_logged')==='1'){ loginPage.style.display='none'; }
function openForm(edit=null, type='customer'){
 document.getElementById('formBg').classList.add('open'); fType.value=type;
 if(type==='bulk'){
   formTitle.textContent='Bulk Sewing Job'; formCustomer.style.display='none'; formBulk.style.display='block';
   if(!edit){['bClient','bPhone','bStyle','bQty','bPricePer','bTotal','bDep','bCostPer','bDate','bNote'].forEach(id=>document.getElementById(id).value=''); fId.value=''; bProg.value='Not Started'; return;}
   fId.value=edit.id; bClient.value=edit.client; bPhone.value=edit.phone; bStyle.value=edit.style; bQty.value=edit.qty; bPricePer.value=edit.pricePer; bTotal.value=edit.total; bDep.value=edit.dep; bCostPer.value=edit.costPer; bDate.value=edit.date; bNote.value=edit.note; bProg.value=edit.prog;
 } else {
   formTitle.textContent=edit?'Edit Job':'New Job'; formBulk.style.display='none'; formCustomer.style.display='block';
   if(!edit){['fId','fName','fPhone','fStyle','fChest','fLength','fWaist','fShoulder','fPrice','fDep','fCost','fDate','fNote'].forEach(id=>document.getElementById(id).value='');return;}
   fId.value=edit.id; fName.value=edit.name; fPhone.value=edit.phone; fStyle.value=edit.style; fChest.value=edit.chest; fLength.value=edit.length; fWaist.value=edit.waist; fShoulder.value=edit.shoulder; fPrice.value=edit.price; fDep.value=edit.dep; fCost.value=edit.cost||0; fDate.value=edit.date; fNote.value=edit.note;
 }
}
function closeForm(){formBg.classList.remove('open');}
function calcBulk(){ let q=+(bQty.value||0); let p=+(bPricePer.value||0); bTotal.value=q*p; }
function saveCurrent(){ if(fType.value==='bulk') saveBulk(); else saveJob(); }
function saveJob(){
 let id=fId.value||Date.now().toString();
 let o={id,name:fName.value.trim(),phone:fPhone.value.trim(),style:fStyle.value.trim(),chest:fChest.value,length:fLength.value,waist:fWaist.value,shoulder:fShoulder.value,price:+(fPrice.value||0),dep:+(fDep.value||0),cost:+(fCost.value||0),date:fDate.value,note:fNote.value,status:'pending',created:Date.now()};
 if(!o.name){alert('Enter name');return;}
 let i=DB.findIndex(x=>x.id===id); if(i>=0) DB[i]={...DB[i],...o}; else DB.unshift(o); save(); closeForm();
}
function saveBulk(){
 let id=fId.value||Date.now().toString();
 let qty=+(bQty.value||0); let pricePer=+(bPricePer.value||0);
 let o={id,client:bClient.value.trim(),phone:bPhone.value.trim(),style:bStyle.value.trim(),qty,pricePer,total:qty*pricePer,dep:+(bDep.value||0),costPer:+(bCostPer.value||0),costTotal:qty*(+(bCostPer.value||0)),date:bDate.value,note:bNote.value.trim(),prog:bProg.value,status:'pending',created:Date.now()};
 if(!o.client||!qty){alert('Enter client and quantity');return;}
 let i=BULK.findIndex(x=>x.id===id); if(i>=0) BULK[i]={...BULK[i],...o}; else BULK.unshift(o); save(); closeForm();
}
function del(id){if(confirm('Delete?')){DB=DB.filter(x=>x.id!==id);save();}}
function delBulk(id){if(confirm('Delete bulk job?')){BULK=BULK.filter(x=>x.id!==id);save();}}
function toggleDone(id){let j=DB.find(x=>x.id===id);j.status=j.status==='done'?'pending':'done';save();}
function addPay(id){let j=DB.find(x=>x.id===id);let amt=prompt('Add payment ₦? Balance ₦'+(j.price-j.dep));if(amt===null)return;amt=+amt; if(isNaN(amt))return; j.dep+=amt; save();}
function addPayBulk(id){let j=BULK.find(x=>x.id===id);let amt=prompt('Add payment ₦? Balance ₦'+(j.total-j.dep));if(amt===null)return;amt=+amt; if(isNaN(amt))return; j.dep+=amt; save();}
function render(){
 let list=DB.filter(periodFilter); let bulkList=BULK.filter(periodFilter); let sellList=SELL.filter(periodFilter);
 let total=list.reduce((s,x)=>s+x.price,0)+bulkList.reduce((s,x)=>s+x.total,0);
 let rec=list.reduce((s,x)=>s+x.dep,0)+bulkList.reduce((s,x)=>s+x.dep,0)+sellList.reduce((s,x)=>s+x.price,0);
 let out=total-rec;
 let profit=list.reduce((s,x)=>s+(x.dep-(x.cost||0)),0)+bulkList.reduce((s,x)=>s+(x.dep-(x.costTotal||0)),0)+sellList.reduce((a,b)=>a+b.profit,0);
 showing.textContent=`Showing: ${period==='all'?'All Time':period} (${list.length+bulkList.length})`;
 sSales.textContent='₦'+total.toLocaleString(); sRec.textContent='₦'+rec.toLocaleString(); sOut.textContent='₦'+out.toLocaleString(); sProf.textContent='₦'+profit.toLocaleString();
 let q=(search.value||'').toLowerCase();
 let filtered=DB.filter(d=>!q|| (d.name+' '+d.phone+' '+d.style).toLowerCase().includes(q) );
 let h=''; filtered.slice().reverse().forEach(j=>{
   let bal=j.price-j.dep;
   h+=`<div class="job"><div class="row" style="justify-content:space-between"><div><b>${j.name}</b> <span class="small">${j.phone}</span><div class="small">${j.style||''} ${j.date?'• '+j.date:''}</div><div class="small">M: C${j.chest||'-'} L${j.length||'-'} W${j.waist||'-'} S${j.shoulder||'-'}</div></div><span style="font-size:11px;padding:4px 8px;border-radius:20px;background:${j.status==='done'?'#dcfce7':'#fef3c7'};font-weight:700">${j.status}</span></div><div class="small" style="margin-top:6px">Price ₦${j.price.toLocaleString()} • Paid ₦${j.dep.toLocaleString()} • <b style="color:${bal<=0?'green':'#b45309'}">Bal ₦${bal.toLocaleString()}</b></div><div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn btn-light" onclick="openForm(DB.find(x=>x.id==='${j.id}'),'customer')">✏️ Edit</button><button class="btn btn-green" style="padding:6px 10px" onclick="addPay('${j.id}')">💰 Payment</button><button class="btn btn-light" onclick="toggleDone('${j.id}')">${j.status==='done'?'↩':'✓'} ${j.status==='done'?'Pending':'Done'}</button><button class="btn btn-light" onclick="del('${j.id}')">
