.btn{padding:10px 14px;border-radius:12px;border:none;font-weight:600;font-size:12px;cursor:pointer}
.btn-green{background:#16a34a;color:white}
.btn-dark{background:#1e293b;color:white}
.small{font-size:11px;color:#64748b}
.filter{padding:7px 14px;border-radius:20px;border:1px solid #cbd5e1;background:white;font-size:11px;white-space:nowrap;cursor:pointer}

.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.progress{height:7px;background:#f1f5f9;border-radius:10px;margin-top:6px;overflow:hidden}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal-box{background:white;border-radius:16px;padding:18px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto;box-sizing:border-box}
.lang-btn{padding:5px 10px;border-radius:15px;border:1px solid #cbd5e1;background:white;font-size:11px;font-weight:bold;cursor:pointer}
.badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:bold}
.table-ui{width:100%;border-collapse:collapse;font-size:12px;text-align:left;margin-top:8px}
.table-ui th,.table-ui td{padding:8px 6px;border-bottom:1px solid #f1f5f9}

function filterList(arr, isBulk){
 var now = new Date();
 var out = [];
 for(var i=0; i<arr.length; i++){
  var item = arr[i];
  var d = new Date(item.date);
  var ok = true;
  if(filter==="This Month"){ ok = (d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear()); }
  if(filter==="This Quarter"){
    var q = Math.floor(now.getMonth()/3);
    var oq = Math.floor(d.getMonth()/3);
    ok = (oq===q && d.getFullYear()===now.getFullYear());
  }
  if(filter==="This Year"){ ok = (d.getFullYear()===now.getFullYear()); }
  if(!ok) continue;
  if(search!==""){
    var s = search.toLowerCase();
    var nameToMatch = (isBulk ? item.school : item.name) || "";
    var typeToMatch = item.type || "";
    var phoneToMatch = (isBulk ? item.contact : item.phone) || "";
    if(nameToMatch.toLowerCase().indexOf(s)===-1 && typeToMatch.toLowerCase().indexOf(s)===-1 && phoneToMatch.indexOf(s)===-1){
      continue;
    }
  }
  out.push(item);
 }
 return out;
}

function saveNewBulkOrder(){
 var school = document.getElementById('b_school').value.trim();
 if(!school){ alert("Please enter school or organization name"); return; }
 var type = document.getElementById('b_type').value.trim() || "School Uniforms";
 var qty = parseFloat(document.getElementById('b_qty').value) || 0;
 var unitPrice = parseFloat(document.getElementById('b_unit_price').value) || 0;
 var unitCost = parseFloat(document.getElementById('b_unit_cost').value) || 0;
 var paid = parseFloat(document.getElementById('b_paid').value) || 0;
 var contact = document.getElementById('b_contact').value.trim();
 var deadline = document.getElementById('b_deadline').value || "No Deadline";

 if(qty <= 0 || unitPrice <= 0){ alert("Please enter valid quantity and unit price"); return; }

 var total = qty * unitPrice;
 var cost = qty * unitCost;
 var profit = total - cost;

 bulkOrders.unshift({
  id: Date.now(),
  school: school,
  type: type,
  qty: qty,
  completedQty: 0,
  unitPrice: unitPrice,
  unitCost: unitCost,
  total: total,
  cost: cost,
  profit: profit,
  paid: paid,
  contact: contact,
  date: new Date().toISOString().slice(0,10),
  deadline: deadline
 });saveAll();

 closeModal();
 showList();
}

function updateBulkProgress(id){
 var b = null;
 for(var i=0; i<bulkOrders.length; i++){ if(bulkOrders[i].id===id){ b=bulkOrders[i]; break; } }
 if(!b) return;
 var newCount = prompt("Total pieces sewn so far out of " + b.qty + ":", b.completedQty);
 if(newCount !== null){
  var n = parseInt(newCount, 10);
  if(!isNaN(n) && n >= 0){
    b.completedQty = Math.min(n, b.qty);
    showList();
  }
 }
}

function exportCSV(){
 var cList = filterList(customers, false);
 var bList = filterList(bulkOrders, true);
 var csv = "Category,Name/School,Type,Quantity,Total,Cost,Profit,Paid,Debt,Date\n";
 for(var i=0; i<cList.length; i++){
  var c = cList[i];
  csv += ["Individual", '"'+c.name+'"', '"'+c.type+'"', 1, c.total, (c.cost||0), c.profit, c.paid, (c.total-c.paid), c.date].join(",") + "\n";
 }
 for(var j=0; j<bList.length; j++){
  var b = bList[j];
  csv += ["Bulk/School", '"'+b.school+'"', '"'+b.type+'"', b.qty, b.total, b.cost, b.profit, b.paid, (b.total-b.paid), b.date].join(",") + "\n";
 }
 var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
 var url = URL.createObjectURL(blob);
 var a = document.createElement("a");
 a.href = url;
 a.download = "TailorKeeper_Consolidated_" + filter.replace(/\s+/g,'_') + ".csv";
 document.body.appendChild(a);
 a.click();
 document.body.removeChild(a);
}
