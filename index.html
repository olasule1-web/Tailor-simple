function filterList(arr, isBulk){
 var now = new Date();
 var out = [];
 for(var i=0; i<arr.length; i++){
  var item = arr[i];
  var d = new Date(item.date);
  var ok = true;
  if(filter==="This Month"){ ok = (d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear()); }
  if(filter==="This Quarter"){
    var q = Math.floor(now.getMonth()/3);
    var oq = Math.floor(d.getMonth()/3);
    ok = (oq===q && d.getFullYear()===now.getFullYear());
  }
  if(filter==="This Year"){ ok = (d.getFullYear()===now.getFullYear()); }
  if(!ok) continue;
  if(search!==""){
    var s = search.toLowerCase();
    var nameToMatch = (isBulk ? item.school : item.name) || "";
    var typeToMatch = item.type || "";
    var phoneToMatch = (isBulk ? item.contact : item.phone) || "";
    if(nameToMatch.toLowerCase().indexOf(s)===-1 && typeToMatch.toLowerCase().indexOf(s)===-1 && phoneToMatch.indexOf(s)===-1){
      continue;
    }
  }
  out.push(item);
 }
 return out;
}

    if(nameToMatch.toLowerCase().indexOf(s)===-1 && typeToMatch.toLowerCase().indexOf(s)===-1 && phoneToMatch.indexOf(s)===-1){

  }

 }
 return out;

 if(edit){ h+='<button onclick="addCustom()" style="width:100%;margin-top:10px;padding:12px;border:2px dashed #10b981;background:rgba(16,185,129,0.1);color:#10b981;border-radius:12px;font-weight:bold">'+tr('addAny')+'</button>'; }
 h+='</div></div></div><div style="position:fixed;bottom:0;left:0;right:0;padding:12px;background:#0f172a;border-top:1px solid #1e293b"><div style="max-width:480px;margin:0 auto">'+(edit?'<button class="btn btn-green" style="width:100%;padding:14px" onclick="saveMeasure()">'+tr('save')+'</button>':'<button class="btn" style="width:100%;padding:14px;background:#14532d;color:#6ee7b7;border:none;border-radius:12px" onclick="edit=true;renderMeasure()">'+tr('edit')+'</button>')+'</div></div></div>';
 document.getElementById('app').innerHTML=h;
}
function addCustom(){ current.custom.push({n:"",v:""}); renderMeasure(); edit=true; }
function delCustom(i){ current.custom.splice(i,1); renderMeasure(); }
function saveMeasure(){
 current.bust=document.getElementById('bust').value; current.shoulder=document.getElementById('shoulder').value; current.sleeve=document.getElementById('sleeve').value; current.topLen=document.getElementById('topLen').value; current.waist=document.getElementById('waist').value; current.hip=document.getElementById('hip').value; current.trouser=document.getElementById('trouser').value; current.neck=document.getElementById('neck').value;
 for(var j=0;j<current.custom.length;j++){ var nn=document.getElementById('cn'+j); var vv=document.getElementById('cv'+j); if(nn) current.custom[j].n=nn.value; if(vv) current.custom[j].v=vv.value; }
 edit=false; renderMeasure();
}
function deleteCustomer(id){ if(confirm("Delete?")){ var arr=[]; for(var i=0;i<customers.length;i++){ if(customers[i].id!==id) arr.push(customers[i]); } customers=arr; showList(); } }

showLock();
</script>
