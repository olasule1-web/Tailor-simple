<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tailor Keeper Pro</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f6f7fb;color:#111}
.top{position:sticky;top:0;z-index:10;background:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.logo{display:flex;gap:10px;align-items:center}
.sc{width:38px;height:38px;background:#111;display:grid;place-items:center;border-radius:10px;color:#fff;font-size:20px}
.h1{font-weight:800;font-size:16px}.h2{font-size:12px;color:#666}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn-dark{background:#111;color:#fff}.btn-light{background:#eef0f6;color:#111}
.btn-pay{background:#16a34a;color:#fff;padding:6px 10px;border-radius:10px;font-size:12px}
.wrap{max-width:520px;margin:0 auto;padding:12px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:12px 0}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.slab{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.5px}
.sval{font-size:18px;font-weight:800;margin-top:4px}
.row{display:flex;gap:8px}
.inp{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:12px;outline:0}
.job{margin-top:10px;border-radius:16px;background:#fff;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.job-top{display:flex;justify-content:space-between;align-items:center}
.badge{font-size:11px;padding:4px 8px;border-radius:20px;background:#eef2ff;font-weight:700}
.badge.done{background:#dcfce7}.badge.pending{background:#fef3c7}
.actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:50;padding:14px}
.modal-bg.open{display:grid}
.modal{width:100%;max-width:480px;background:#fff;border-radius:20px;padding:16px;max-height:90vh;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{font-size:12px;font-weight:700;color:#333;margin-top:6px;display:block}
.small{font-size:12px;color:#666}
</style>
</head>
<body>
<div class="top">
  <div class="logo"><div class="sc">✂️</div><div><div class="h1">Tailor Keeper</div><div class="h2">Warri • Delta</div></div></div>
  <div class="row"><button class="btn btn-light" id="langBtn">EN/HA</button><button class="btn btn-dark" onclick="openForm()">+ New</button></div>
</div>
<div class="wrap">
  <div class="stats">
    <div class="card"><div class="slab" data-t="total">Total</div><div class="sval" id="stTotal">0</div></div>
    <div class="card"><div class="slab" data-t="pending">Pending</div><div class="sval" id="stPend">0</div></div>
    <div class="card"><div class="slab" data-t="income">Income</div><div class="sval" id="stInc">₦0</div></div>
  </div>
  <div class="row"><input class="inp" id="search" placeholder="Search name / phone / style..."><select class="inp" id="filter" style="max-width:120px"><option value
